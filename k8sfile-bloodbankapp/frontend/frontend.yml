apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blood-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vishnu4538/bloodui:v1
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "10m"
            memory: "10Mi"
          limits:
            cpu: "100m"
            memory: "512Mi"
        
