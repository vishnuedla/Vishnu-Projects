apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blood-bank
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vishnu4538/frontend:v1
        ports:
        - containerPort: 80
        
